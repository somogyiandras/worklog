name: Haskell CI on windows

on:
  workflow_dispatch
  
jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12'
          cabal-version: '3.12'

      - name: Build
        run: cabal build exe:worklog

      - name: Prepare executable
        shell: pwsh
        run: |
          $exe = cabal list-bin exe:worklog
          Copy-Item $exe ./worklog.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: worklog-windows-x86_64
          path: worklog.exe
          retention-days: 20
